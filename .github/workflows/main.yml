name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent name'
        required: true
        default: 'chiko identity'
      agent_description:
        description: 'Agent description'
        required: true
        default: 'chiko identity AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ClawHub verified-agent-identity skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Create new Ethereum Identity
        working-directory: scripts
        run: node createNewEthereumIdentity.js

      - name: Link Human to Agent
        working-directory: scripts
        run: >-
          node manualLinkHumanToAgent.js
          --challenge '{"name":"${{ inputs.agent_name }}","description":"${{ inputs.agent_description }}"}'
